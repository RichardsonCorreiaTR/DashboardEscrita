<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minhas Metas - Escrita Fiscal</title>
  <link rel="stylesheet" href="/shared/css/app.css?v=13">
</head>
<body class="com-sidebar">

  <nav id="nav-container"></nav>

  <div class="pagina">
    <header class="header">
      <div class="header__info">
        <h1 class="header__title" id="page-title">Minhas Metas</h1>
        <span class="header__subtitle">Escrita Fiscal - Thomson Reuters / Betha</span>
      </div>
      <div class="header__acoes">
        <span id="header-usuario" style="font-size:0.8rem;color:#94a3b8;margin-right:0.75rem"></span>
        <select id="eq-ano-select" class="btn btn--outline" style="font-size:0.82rem;padding:4px 8px;margin-right:0.5rem;cursor:pointer" title="Ano de consulta"></select>
        <button id="btn-atualizar" class="btn btn--outline" title="Busca seus dados no banco e atualiza o cache local">Atualizar</button>
        <a href="/auth/logout" class="btn btn--outline" style="font-size:0.8rem">Sair</a>
      </div>
    </header>

    <div id="eq-fonte-info" class="fonte-info" hidden></div>

    <main id="equipes-main" class="dashboard">
      <div class="loading" id="equipes-loading">
        <div class="loading__spinner"></div>
        <span>Carregando...</span>
      </div>
    </main>

    <footer class="footer">
      <span>Metas Analista v1.0</span>
      <span>Escrita Fiscal</span>
    </footer>
  </div>

  <script src="/shared/js/format-utils.js?v=7"></script>
  <script src="/shared/js/metas-config.js?v=10"></script>
  <script src="/shared/js/equipes-mensal.js?v=15"></script>
  <script src="/shared/js/equipes-detalhe.js?v=11"></script>
  <script src="/shared/js/equipes-ne-definicao.js?v=2"></script>
  <script src="/shared/js/equipes-conclusao-pontos.js?v=2"></script>
  <script src="/js/nav-analista.js?v=3"></script>
  <script src="/js/app-analista.js?v=2"></script>
</body>
</html>
